[Translations]
$modDisplayName=Mantle
$modDescription=Перелезание через препятствия. Препятствие обмеряется лучами в момент нажатия, поэтому высота подъёма равна высоте того, что перед вами. Изменения здесь вступают в силу примерно через секунду после закрытия меню.

$climbing=Лазание

$trigger=Срабатывание
$auto=Автоматически
$autoMouse=Лезть без удержания клавиши использования — просто упершись во что-то. По умолчанию выключено: режим работает хорошо, но триггер, срабатывающий сам, делает любую другую странность похожей на чужую.
$retry=Задержка повтора
$retryMouse=Секунды до повторного замера, если предыдущий ничего не нашёл. Это и есть вся задержка перед подъёмом — сами проверки больше не ждут, осталось лишь то, во что обходится промах. Меньше значит резче и тратит лучи на всё непролазное, к чему вы прислонились.

$feel=Ощущение
$camera=Наклон камеры
$cameraMouse=На сколько градусов взгляд опускается в середине подъёма во весь рост; для мелких препятствий меньше. Наклон нарастает и уходит сам, мышь при этом работает всё время — ничего не блокируется. 0 оставляет камеру в покое.
$push=Толчок вперёд
$pushMouse=Насколько сильно вас толкает вперёд в конце подъёма. Подъём двигает вас позицией, а не скоростью, поэтому без толчка вы оказываетесь наверху без движения и замираете. 0 отключает.
