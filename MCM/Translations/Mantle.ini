[Translations]
$modDisplayName=Mantle
$modDescription=Climbing over things. The obstacle is measured with ray casts at the moment you ask, so the height of the climb is whatever the obstacle actually is. Changes here take effect about a second after this menu closes.

$climbing=Climbing

$trigger=Trigger
$auto=Automatic
$autoMouse=Climb without holding the activate key, on walking into something and being stopped by it. Off by default: it works well, but a trigger that fires on its own makes every other oddity look like a different one.
$retry=Retry Delay
$retryMouse=Seconds before a measurement that found nothing is tried again. This is the whole of the delay before a climb -- none of the tests wait any more, so what is left is what a missed read costs you. Lower is sharper, and spends ray casts on anything unclimbable you lean against.

$feel=Feel
$camera=Camera Dip
$cameraMouse=Degrees the view dips at the middle of a full height climb, less for smaller obstacles. It swells and fades on its own and the mouse answers throughout -- nothing is locked. 0 leaves the camera alone.
$push=Forward Push
$pushMouse=How hard you are shoved forward as the climb releases. The climb moves you by position rather than by speed, so without this you arrive on top of the obstacle carrying nothing and stop dead. 0 turns it off.
